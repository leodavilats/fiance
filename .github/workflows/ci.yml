name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-tokens:
    name: Design tokens (sincronia web/mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A régua de score já divergiu entre web e mobile por ser mantida à mão em
      # três arquivos. Token gerado só vale se a divergência falhar o build.
      - name: Verificar tokens gerados
        run: node design-tokens/build.mjs --check

      # Contraste é gerado da mesma fonte que a cor, então também é verificável
      # de lá. A diferença entre 4,4 e 4,6 não se enxerga em revisão visual, mas
      # separa quem lê a tela de quem não lê.
      - name: Verificar contraste (WCAG AA)
        run: node design-tokens/check-contrast.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Pillow
        run: pip install --quiet Pillow

      # Favicon e launcher ja carregaram a marca antiga por uma versao inteira:
      # eram escritos a mao e ninguem os regerava quando a cor mudava.
      - name: Verificar marca (favicon e icones)
        run: python design-tokens/build-icons.py --check

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # O contrato do cache compartilhado é o mesmo para os dois backends, mas
      # só o de disco roda sem infraestrutura. Sem este serviço, metade do
      # contrato ficaria pulada para sempre — e a metade pulada é justamente a
      # que existe para o dia em que houver mais de um nó.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests

      - name: Testes
        run: python -m pytest -q
        env:
          # A suíte não deve depender de rede nem de segredo real; o conftest
          # já isola o banco e stuba a BRAPI.
          APP_ENV: development
          # Só o teste de contrato do cache usa isto. `REDIS_URL` continua
          # ausente de propósito: o padrão do produto é o cache local, e é ele
          # que o resto da suíte tem que exercitar.
          REDIS_TEST_URL: redis://localhost:6379/0

  web:
    name: Web (build + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Formatação (prettier)
        run: npm run format:check

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build

      # Ícone não registrado e classe inexistente não quebram o build — quebram
      # a tela em runtime. O lint roda depois do build de propósito: a fonte de
      # verdade das classes é o CSS que o build de fato emitiu.
      - name: Ícones e classes (lint de runtime)
        run: npm run lint:ui

  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

  e2e:
    name: E2E (navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências do backend
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Instalar dependências do web
        run: npm ci
        working-directory: web

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Testes de ponta a ponta
        run: npm run e2e
        working-directory: web
        env:
          APP_ENV: development
          CI: 'true'

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
