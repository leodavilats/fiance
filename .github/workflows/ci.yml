name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marca:
    name: Marca (favicon e ícones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Pillow
        run: pip install --quiet Pillow

      # Favicon e launcher ja carregaram a marca antiga por uma versao inteira:
      # eram escritos a mao e ninguem os regerava quando a cor mudava.
      - name: Verificar marca (favicon e icones)
        run: python design-tokens/build-icons.py --check

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # O contrato do cache compartilhado é o mesmo para os dois backends, mas
      # só o de disco roda sem infraestrutura. Sem este serviço, metade do
      # contrato ficaria pulada para sempre — e a metade pulada é justamente a
      # que existe para o dia em que houver mais de um nó.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests

      - name: Testes
        run: python -m pytest -q
        env:
          # A suíte não deve depender de rede nem de segredo real; o conftest
          # já isola o banco e stuba a BRAPI.
          APP_ENV: development
          # Só o teste de contrato do cache usa isto. `REDIS_URL` continua
          # ausente de propósito: o padrão do produto é o cache local, e é ele
          # que o resto da suíte tem que exercitar.
          REDIS_TEST_URL: redis://localhost:6379/0

  web:
    name: Web (build + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Formatação (prettier)
        run: npm run format:check

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build

      # Ícone não registrado e classe inexistente não quebram o build — quebram
      # a tela em runtime. O lint roda depois do build de propósito: a fonte de
      # verdade das classes é o CSS que o build de fato emitiu.
      - name: Ícones e classes (lint de runtime)
        run: npm run lint:ui

      # Mede a paleta escrita à mão das duas plataformas contra o piso de contraste. Não depende
      # do build: lê `foundation.css` e `design_tokens.dart` direto.
      - name: Contraste (AA nos dois temas)
        run: npm run lint:contrast

  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

  android:
    name: Mobile (build Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: gradle-

      - name: Instalar dependências
        run: flutter pub get

      # O google-services.json real é segredo e não está no repositório; sem nenhum o plugin do
      # Firebase para o build. O substituto não fala com projeto nenhum e serve só para compilar.
      - name: Configuração do Firebase para compilar
        run: cp android/app/google-services.ci.json android/app/google-services.json

      # `flutter analyze` e `flutter test` nunca tocam o Gradle: o bump do Kotlin para 2.2 deixou
      # o build Android quebrado por um plugin preso na linguagem 1.6, e a suíte ficou verde o
      # tempo todo. Este job é o que enxerga essa metade.
      - name: Build de release (APK)
        run: flutter build apk --release

  e2e:
    name: E2E (navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências do backend
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Instalar dependências do web
        run: npm ci
        working-directory: web

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Testes de ponta a ponta
        run: npm run e2e
        working-directory: web
        env:
          APP_ENV: development
          CI: 'true'

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
