name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marca:
    name: Marca (ícones do aplicativo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Pillow
        run: pip install --quiet Pillow

      # O launcher ja carregou a marca antiga por uma versao inteira: era escrito a mao e
      # ninguem o regerava quando a cor mudava.
      - name: Verificar marca (icones do aplicativo)
        run: python tool/build_icons.py --check

  documentacao:
    name: Documentação (links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # O docs/README dizia que o verificador rodava no CI, e nenhum job o chamava: link
      # quebrado passava verde.
      - name: Verificar links entre documentos
        run: node docs/checar-links.mjs

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # O contrato do cache compartilhado é o mesmo para os dois backends, mas
      # só o de disco roda sem infraestrutura. Sem este serviço, metade do
      # contrato ficaria pulada para sempre — e a metade pulada é justamente a
      # que existe para o dia em que houver mais de um nó.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check app tests migrations
          python -m ruff format --check app tests

      - name: Testes
        run: python -m pytest -q
        env:
          # A suíte não deve depender de rede nem de segredo real; o conftest
          # já isola o banco e stuba a BRAPI.
          APP_ENV: development
          # Só o teste de contrato do cache usa isto. `REDIS_URL` continua
          # ausente de propósito: o padrão do produto é o cache local, e é ele
          # que o resto da suíte tem que exercitar.
          REDIS_TEST_URL: redis://localhost:6379/0

  data-job:
    name: Data-job (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-job
    services:
      # A gravação usa COPY e ON CONFLICT do Postgres; sem este serviço os testes dela são pulados.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: mercado_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: data-job/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check datajob tests migrations
          python -m ruff format --check datajob tests migrations

      - name: Testes
        run: python -m pytest -q
        env:
          DATAJOB_TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/mercado_teste

  trend-backend:
    name: Pesquisa (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trend-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: trend-backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check pesquisa tests
          python -m ruff format --check pesquisa tests

      - name: Testes
        run: python -m pytest -q

  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

  android:
    name: Mobile (build Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: gradle-

      - name: Instalar dependências
        run: flutter pub get

      # O google-services.json real é segredo e não está no repositório; sem nenhum o plugin do
      # Firebase para o build. O substituto não fala com projeto nenhum e serve só para compilar.
      - name: Configuração do Firebase para compilar
        run: cp android/app/google-services.ci.json android/app/google-services.json

      # `flutter analyze` e `flutter test` nunca tocam o Gradle: o bump do Kotlin para 2.2 deixou
      # o build Android quebrado por um plugin preso na linguagem 1.6, e a suíte ficou verde o
      # tempo todo. Este job é o que enxerga essa metade.
      - name: Build de release (APK)
        run: flutter build apk --release
