<div
  class="fixed bottom-4 right-4 z-[400] flex flex-col gap-2 max-w-md"
  role="status"
  aria-live="polite"
>
  @for (msg of snackbar.messages(); track msg.id) {
    <div
      class="fi-toast flex items-center gap-3 p-4 rounded-lg shadow-popover animate-slide-in"
      [class.fi-toast-error]="msg.type === 'error'"
      [class.fi-toast-success]="msg.type === 'success'"
      [class.fi-toast-info]="msg.type === 'info'"
    >
      <lucide-icon
        [name]="
          msg.type === 'error' ? 'circle-x' : msg.type === 'success' ? 'circle-check' : 'info'
        "
        size="20"
        class="flex-shrink-0"
        [class.text-adverse]="msg.type === 'error'"
        [class.text-favorable]="msg.type === 'success'"
        [class.text-brand]="msg.type === 'info'"
      ></lucide-icon>
      <p class="fi-body flex-1 m-0">{{ msg.message }}</p>
      <button
        type="button"
        class="btn-icon btn-icon-quiet"
        [attr.aria-label]="'Dispensar aviso'"
        (click)="snackbar.remove(msg.id)"
      >
        <lucide-icon name="x" size="16"></lucide-icon>
      </button>
    </div>
  }
</div>
