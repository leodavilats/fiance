@if (loading.loading()) {
  <div class="fixed inset-0 fi-overlay z-[100] flex items-center justify-center backdrop-blur-sm">
    <div
      class="flex flex-col items-center gap-3 p-6 rounded-xl bg-ground-1 border border-hairline shadow-popover"
    >
      <lucide-icon name="loader-circle" size="32" class="animate-spin text-brand"></lucide-icon>
      <p class="text-ink font-medium">Carregando...</p>
    </div>
  </div>
}
