# Migrações de schema versionadas.
#
# Antes havia um migrador caseiro (`_add_missing_columns`) que só adicionava
# colunas: não renomeava, não mudava tipo, não fazia backfill de dado derivado
# e interpolava defaults em SQL por string. Funcionou enquanto não havia
# usuários em produção; a primeira renomeação seria manual e arriscada.
#
# A URL do banco vem de DATABASE_URL (via app.core.config) — não fica aqui.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
